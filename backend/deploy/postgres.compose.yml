# Private PostgreSQL for PISTOL GENESIS; no host-exposed database port.
# Requires GENESIS_SECRET_DIR=/opt/genesis-sql-secrets.
name: pistol-genesis-sql

services:
  postgres:
    image: postgres:16-alpine
    container_name: genesis-postgres
    restart: unless-stopped
    shm_size: "64m"
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - genesis-postgres-data:/var/lib/postgresql/data
      - ${GENESIS_SECRET_DIR:?Set GENESIS_SECRET_DIR}/admin_password:/run/secrets/admin_password:ro
    command:
      - postgres
      - -c
      - max_connections=25
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
    networks:
      - genesis-sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  genesis-sql:
    name: genesis-sql
    internal: true

volumes:
  genesis-postgres-data:
    name: genesis-postgres-data
