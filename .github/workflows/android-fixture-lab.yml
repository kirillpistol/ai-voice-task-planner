name: Android Fixture Lab APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/android_fixture_app/**'
      - '.github/workflows/android-fixture-lab.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon -p experiments/android_fixture_app :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-fixture-lab-debug
          path: experiments/android_fixture_app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
