name: PISTOL GENESIS - downloadable APK

on:
  push:
    branches:
      - feature/execution-routing-isolation-20261015
    paths:
      - ".github/workflows/genesis-apk-download.yml"
      - "composeApp/**"
      - "shared/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: genesis-preview-apk
  cancel-in-progress: false

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Android sources
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Android APK
        run: bash ./gradlew :composeApp:assembleDebug --stacktrace
      - name: Prepare standalone APK
        run: |
          test -s composeApp/build/outputs/apk/debug/composeApp-debug.apk
          mkdir -p publish
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk publish/PISTOL-GENESIS.apk
          cd publish
          sha256sum PISTOL-GENESIS.apk > SHA256SUMS.txt
      - name: Publish direct download in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: genesis-preview
          target_commitish: ${{ github.sha }}
          name: PISTOL GENESIS | Android APK
          prerelease: true
          make_latest: false
          body: |
            ## PISTOL GENESIS — Android

            Download **PISTOL-GENESIS.apk** from Assets and open it on your Android device.

            This is a testing/debug APK, not a production-signed release.
            Firebase authentication and backend connection depend on deployment configuration.

            SHA256 checksum is supplied in SHA256SUMS.txt.
          files: |
            publish/PISTOL-GENESIS.apk
            publish/SHA256SUMS.txt
          overwrite_files: true
